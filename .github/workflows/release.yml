name: release

# Cuts a release when a version tag is pushed.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# The same workflow can be run by hand from the Actions tab to rehearse a
# release - it builds and verifies everything and then stops, because a release
# is a public act that should only follow a tag.
#
# The keystore is never committed. If the signing secrets are absent the build
# still runs and produces a debug-signed artifact, but the release is then
# marked as unsigned so nobody mistakes it for a shippable one. See
# docs/RELEASE.md for creating the key and storing the secrets.

on:
  push:
    tags:
      - "v*"
  # A manual run is a rehearsal: it runs every check and builds both artifacts,
  # then stops and prints what a tag push would publish. Only a `v*` tag
  # publishes, so a mistaken button cannot create a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish a release
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The same step as in build.yml, verbatim: ci/check-workflows.py fails if the
      # two ever differ, because a release that fails where the build succeeded is
      # the worst way to find out that the two had drifted apart.
      - name: Install the Android SDK packages the project needs
        run: |
          set -uo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          # Pre-accepting the licenses lets AGP auto-install anything it still
          # needs (for example a build-tools revision) without prompting.
          mkdir -p "$SDK/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK/licenses/android-sdk-preview-license"

          yes | "$MANAGER" --licenses > /dev/null || true
          "$MANAGER" --install "platform-tools" "platforms;android-36"
          # Best effort: if this exact build-tools revision is unavailable, AGP
          # downloads the one it targets by itself.
          "$MANAGER" --install "build-tools;36.0.0" || \
            echo "::warning::build-tools;36.0.0 unavailable, AGP will fetch its own"
          "$MANAGER" --list_installed || true

      # The first gate, before anything is built or signed. It aggregates the static
      # release guards and adds the fingerprint-format check, so a tag pushed against a
      # repository that is not ready - no changelog section for the version, a malformed
      # certificate fingerprint, a credential the docs never named - fails here in seconds
      # with the list of what is missing, rather than four minutes into a signed build.
      # The signing and tile *decisions* that need the secret values still run later, at
      # the moment this workflow has them; this is the readiness of the repository itself.
      - name: Check this repository is ready to release
        run: python3 ci/check-release-ready.py

      - name: Check the security and privacy guarantees
        run: bash ci/check-security.sh

      - name: Check the store listing stays inside the store limits
        run: python3 ci/check-store-metadata.py

      # A release is only worth publishing if the whole suite is green, so these
      # steps fail the job rather than reporting and continuing.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Lint
        run: ./gradlew lintRelease --no-daemon --stacktrace

      # The tiles are checked before the signing, because they are the other thing a
      # release must not get wrong: the default host is the public OpenStreetMap server,
      # which their policy allows a development build to use and forbids a distributed app
      # to use without prior permission. This is the same shape of decision as the signing
      # one below, and it is asked before anything is built.
      - name: Decide whether this run may use the configured map tiles
        env:
          MAP_TILE_SERVER: ${{ vars.MEMORYMAP_TILE_SERVER }}
          MAP_TILE_KEY: ${{ secrets.MEMORYMAP_TILE_KEY }}
          MAP_ATTRIBUTION: ${{ vars.MEMORYMAP_TILE_ATTRIBUTION }}
          MEMORYMAP_OSM_PERMITTED: ${{ vars.MEMORYMAP_OSM_PERMITTED }}
        run: python3 ci/check-tile-provider.py --from-build

      # The decision, before anything is built. On a version tag the four secrets must
      # be there and the artifact is then checked against the recorded certificate; a
      # manual run may deliberately go without them, because it cannot publish and a
      # rehearsal that skips signing proves nothing about the signing path. What is
      # never allowed is a half-configured setup, on any trigger.
      - name: Decide whether this run may build a release artifact
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.MEMORYMAP_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MEMORYMAP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MEMORYMAP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MEMORYMAP_KEY_PASSWORD }}
        run: |
          set -uo pipefail
          present=0
          for value in "$KEYSTORE_B64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -n "$value" ]; then present=$((present + 1)); fi
          done
          case "$present" in
            4) state=complete ;;
            0) state=none ;;
            *) state=partial ;;
          esac
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "secrets present: $present of 4 ($state)"
          python3 ci/check-release-signing.py --ref "$GITHUB_REF" --signing "$state"

      # Decodes the keystore, or generates a throwaway one for a rehearsal, and - the
      # part that saves a five-minute build - refuses to continue if the certificate
      # inside does not match the fingerprint this repository records.
      - name: Put a keystore where the build can use it
        env:
          KEYSTORE_B64: ${{ secrets.MEMORYMAP_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MEMORYMAP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MEMORYMAP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MEMORYMAP_KEY_PASSWORD }}
        run: bash ci/prepare-signing-keystore.sh

      - name: Build the signed release APK and bundle
        env:
          MAP_TILE_SERVER: ${{ vars.MEMORYMAP_TILE_SERVER }}
          MAP_TILE_KEY: ${{ secrets.MEMORYMAP_TILE_KEY }}
          MAP_ATTRIBUTION: ${{ vars.MEMORYMAP_TILE_ATTRIBUTION }}
        run: |
          set -euo pipefail
          . /tmp/signing/signing.env
          # The tile settings reach Gradle as properties, the same way the signing ones
          # do. An empty property is not passed: the build file's `.ifBlank` default has to
          # stay in charge when nothing is configured, or the map would get an empty URL.
          TILE_ARGS=()
          [ -n "${MAP_TILE_SERVER:-}" ] && TILE_ARGS+=("-PMAP_TILE_SERVER=$MAP_TILE_SERVER")
          [ -n "${MAP_TILE_KEY:-}" ] && TILE_ARGS+=("-PMAP_TILE_KEY=$MAP_TILE_KEY")
          [ -n "${MAP_ATTRIBUTION:-}" ] && TILE_ARGS+=("-PMAP_ATTRIBUTION=$MAP_ATTRIBUTION")
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace \
            -PMEMORYMAP_KEYSTORE="$SIGNING_KEYSTORE" \
            -PMEMORYMAP_KEYSTORE_PASSWORD="$SIGNING_STORE_PASSWORD" \
            -PMEMORYMAP_KEY_ALIAS="$SIGNING_KEY_ALIAS" \
            -PMEMORYMAP_KEY_PASSWORD="$SIGNING_KEY_PASSWORD" \
            "${TILE_ARGS[@]}"

      # Reading the certificate out of the artifact is the only way to know which key
      # signed it: every configuration that can go wrong here goes wrong silently, and
      # the artifact is the one place the answer is written down. The bundle is checked
      # as well as the APK, because the bundle is what Play receives.
      #
      # The two artifacts are read by different tools. The bundle is a JAR and keytool
      # reads its certificate; the APK has no JAR signature at all, because AGP drops v1
      # once minSdk is 24 or above ("V1 signature is useless if minSdk is 24+") and this
      # project's minSdk is 26, so apksigner - which lives in the build-tools installed
      # above - reads the APK Signing Block instead. ci/apk-signer-fingerprint.sh picks,
      # tries the other reader if the first finds nothing, and says which answered.
      - name: Verify the artifacts carry the certificate they should
        run: |
          set -euo pipefail
          # apksigner is looked up through the SDK path, which the setup step above also
          # resolves this way.
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          . /tmp/signing/signing.env
          for artifact in \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab; do
            if [ "$SIGNING_MODE" = "release" ]; then
              bash ci/verify-apk-signature.sh --release "$artifact"
            else
              bash ci/verify-apk-signature.sh --rehearsal "$artifact" "$SIGNING_EXPECTED_FINGERPRINT"
            fi
          done

      - name: Shred the key
        if: always()
        run: rm -rf /tmp/signing

      - name: Show what was built
        run: |
          find app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) \
            -printf "%p %s bytes\n"

      # The build workflow checks this on every push. This is the run whose output
      # actually reaches a person - and it is the only one built with a real signing
      # key, so it is the only one where a key that must not ship could have been
      # materialised. The step is here rather than before the build because both
      # checks are about the artifact, not the source.
      - name: Check the built artifacts carry nothing they must not
        run: python3 ci/check-artifacts.py

      # The keystore was shredded a few steps above, so this reads the decision that was
      # made before the build rather than the environment file it produced. Which of the
      # two sentences is printed is the difference between "this artifact could be
      # published" and "this artifact must never be published", so it is not left to the
      # reader of the log to infer from the presence of a directory.
      - name: Say what a real run would publish
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -uo pipefail
          if [ "${{ steps.signing.outputs.state }}" = "complete" ]; then
            echo "Dry run with the real key: the artifacts carry the release certificate, and"
            echo "no release was created because this run is not a tag push."
          else
            echo "Dry run with a throwaway key: the artifacts are NOT release-signed and"
            echo "must not be distributed. No release was created."
          fi
          echo
          echo "A tag push would publish these assets under the tag name:"
          find app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) \
            -printf "  %p %s bytes\n"

      - name: Publish the release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # The section of the changelog for this version, not the whole file: the
          # notes of a release are read by someone deciding whether to install it,
          # and the first version's notes are not that. The extraction lives in
          # `ci/release-notes.sh` and is run on every push by
          # `ci/check-release-notes.py`, so this step is not the first execution of
          # it; the whole changelog is the fallback when a tag has no section.
          NOTES_FILE=/dev/null
          if [ -f CHANGELOG.md ]; then
            if bash ci/release-notes.sh "$TAG" CHANGELOG.md > /tmp/notes-section.md; then
              NOTES_FILE=/tmp/notes-section.md
            else
              NOTES_FILE=CHANGELOG.md
              echo "::warning::no changelog section for ${TAG#v}; publishing the whole file"
            fi
          fi

          ASSETS=()
          while IFS= read -r f; do ASSETS+=("$f"); done < <(
            find app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \)
          )

          # No branch here for "the artifact is debug-signed": a tag with no signing
          # secrets is refused before the build, and the certificate in the artifacts is
          # verified before this step runs, so by the time a release is created it is
          # signed with the key this repository records. The note that used to live here
          # described an artifact nobody should have been able to produce.
          cat "$NOTES_FILE" > /tmp/notes-final.md
          printf '\n---\n\nSigned with the release certificate `%s`.\n' \
            "$(grep -E '^SHA256=' ci/release-fingerprint.txt | tail -1 | cut -d= -f2)" \
            >> /tmp/notes-final.md

          gh release create "$TAG" "${ASSETS[@]}" \
            --title "Memory Map ${TAG}" \
            --notes-file /tmp/notes-final.md
