name: release

# Cuts a release when a version tag is pushed.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# The keystore is never committed. If the signing secrets are absent the build
# still runs and produces a debug-signed artifact, but the release is then
# marked as unsigned so nobody mistakes it for a shippable one. See
# docs/RELEASE.md for creating the key and storing the secrets.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish a release
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install the Android SDK packages the project needs
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Check the security and privacy guarantees
        run: bash ci/check-security.sh

      # A release is only worth publishing if the whole suite is green, so these
      # steps fail the job rather than reporting and continuing.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Lint
        run: ./gradlew lintRelease --no-daemon --stacktrace

      - name: Materialise the signing key if the secrets are present
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.MEMORYMAP_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no MEMORYMAP_KEYSTORE_B64 secret; the artifact will be debug-signed"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > /tmp/memorymap-release.jks
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Build the signed release APK and bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MEMORYMAP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MEMORYMAP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MEMORYMAP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ARGS=(--no-daemon --stacktrace)
          if [ "${{ steps.signing.outputs.present }}" = "true" ]; then
            ARGS+=(-PMEMORYMAP_KEYSTORE=/tmp/memorymap-release.jks)
            [ -n "${KEYSTORE_PASSWORD:-}" ] && ARGS+=(-PMEMORYMAP_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD")
            [ -n "${KEY_ALIAS:-}" ] && ARGS+=(-PMEMORYMAP_KEY_ALIAS="$KEY_ALIAS")
            [ -n "${KEY_PASSWORD:-}" ] && ARGS+=(-PMEMORYMAP_KEY_PASSWORD="$KEY_PASSWORD")
          fi
          ./gradlew assembleRelease bundleRelease "${ARGS[@]}"

      - name: Shred the key
        if: always()
        run: rm -f /tmp/memorymap-release.jks

      - name: Show what was built
        run: |
          find app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) \
            -printf "%p %s bytes\n"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NOTES_FILE=CHANGELOG.md
          [ -f "$NOTES_FILE" ] || NOTES_FILE=/dev/null

          ASSETS=()
          while IFS= read -r f; do ASSETS+=("$f"); done < <(
            find app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \)
          )

          if [ "${{ steps.signing.outputs.present }}" != "true" ]; then
            {
              echo "> **This artifact is debug-signed, not release-signed.**"
              echo "> It is installable for testing and must not be distributed."
              echo
              cat "$NOTES_FILE"
            } > /tmp/notes.md
            NOTES_FILE=/tmp/notes.md
          fi

          gh release create "$TAG" "${ASSETS[@]}" \
            --title "Memory Map ${TAG}" \
            --notes-file "$NOTES_FILE"
