name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble and test (Phase 1)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install the Android SDK packages the project needs
        run: |
          set -uo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          # Pre-accepting the licenses lets AGP auto-install anything it still
          # needs (for example a build-tools revision) without prompting.
          mkdir -p "$SDK/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK/licenses/android-sdk-preview-license"

          yes | "$MANAGER" --licenses > /dev/null || true
          "$MANAGER" --install "platform-tools" "platforms;android-36"
          # Best effort: if this exact build-tools revision is unavailable, AGP
          # downloads the one it targets by itself.
          "$MANAGER" --install "build-tools;36.0.0" || \
            echo "::warning::build-tools;36.0.0 unavailable, AGP will fetch its own"
          "$MANAGER" --list_installed || true

      # Cheap, explicit failure when a version in the catalog does not exist.
      - name: Verify every dependency coordinate resolves
        run: bash ci/verify-dependencies.sh gradle/libs.versions.toml

      - name: Check the Gradle configuration
        run: ./gradlew help --no-daemon --stacktrace

      # `|| true` plus a final gate: every stage runs even if an earlier one
      # fails, so one push reports compile, test, lint and packaging problems
      # together instead of one per push.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace --continue 2>&1 | tee /tmp/unit.log || true

      - name: Lint
        run: ./gradlew lintDebug --no-daemon --stacktrace --continue 2>&1 | tee /tmp/lint.log || true

      - name: Assemble the debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace --continue 2>&1 | tee /tmp/assemble.log || true

      - name: Show what was built
        run: |
          find app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -printf "%p %s bytes\n" || true

      - name: Report a committed Room schema that drifted
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            echo "::error::Room schema changed without committing app/schemas"
            git --no-pager diff --stat app/schemas
            exit 1
          fi

      - name: Publish the failure detail as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          {
            echo "Automated report from workflow run ${{ github.run_id }} on \`${GITHUB_REF_NAME}\`."
            echo
            for f in /tmp/unit.log /tmp/lint.log /tmp/assemble.log; do
              [ -f "$f" ] || continue
              echo "## $(basename "$f")"
              echo '```text'
              grep -E "^e: |error:|^> Task .* FAILED|FAILURE:|Caused by:|^[A-Za-z0-9_.]+(Test|Tests)? > |What went wrong|Execution failed|> " "$f" \
                | tail -n 160 || true
              echo '```'
              echo
              echo "<details><summary>last 200 raw lines</summary>"
              echo
              echo '```text'
              tail -n 200 "$f"
              echo '```'
              echo "</details>"
              echo
            done
            echo "## Failing unit tests"
            echo '```text'
            find app/build/test-results -name "*.xml" -print0 2>/dev/null \
              | xargs -0 grep -l "<failure\|<error" 2>/dev/null || echo "(no test XML produced)"
            for x in $(find app/build/test-results -name "*.xml" 2>/dev/null); do
              if grep -q "<failure\|<error" "$x" 2>/dev/null; then
                echo "--- $x"
                sed -e 's/&#10;/\n/g' "$x" | head -n 120
              fi
            done
            echo '```'
          } > /tmp/report.md

          head -c 60000 /tmp/report.md > /tmp/report-cut.md
          if gh issue create --title "CI failure on ${GITHUB_REF_NAME} (run ${{ github.run_id }})" \
              --body-file /tmp/report-cut.md --label "ci-report" 2>/tmp/issue.err; then
            echo "issue created"
          else
            cat /tmp/issue.err
            gh issue create --title "CI failure on ${GITHUB_REF_NAME} (run ${{ github.run_id }})" \
              --body-file /tmp/report-cut.md || echo "unable to create the issue"
          fi

      - name: Fail the job if any stage failed
        run: |
          for f in /tmp/unit.log /tmp/lint.log /tmp/assemble.log; do
            [ -f "$f" ] || continue
            if grep -qE "BUILD FAILED|FAILURE: Build failed" "$f"; then
              echo "::error::$f reported a failed build"
              exit 1
            fi
          done
          if ! find app/build/outputs/apk/debug -name "*.apk" | grep -q .; then
            echo "::error::no debug APK was produced"
            exit 1
          fi
          echo "all stages green"

      - name: Upload the debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memorymap-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memorymap-reports
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/schemas
          if-no-files-found: ignore
