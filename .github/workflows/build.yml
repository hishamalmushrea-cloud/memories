name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble and test (Phase 1)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install the Android SDK packages the project needs
        run: |
          set -uo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          # Pre-accepting the licenses lets AGP auto-install anything it still
          # needs (for example a build-tools revision) without prompting.
          mkdir -p "$SDK/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK/licenses/android-sdk-preview-license"

          yes | "$MANAGER" --licenses > /dev/null || true
          "$MANAGER" --install "platform-tools" "platforms;android-36"
          # Best effort: if this exact build-tools revision is unavailable, AGP
          # downloads the one it targets by itself.
          "$MANAGER" --install "build-tools;36.0.0" || \
            echo "::warning::build-tools;36.0.0 unavailable, AGP will fetch its own"
          "$MANAGER" --list_installed || true

      # Cheap, explicit failure when a version in the catalog does not exist.
      - name: Verify every dependency coordinate resolves
        run: bash ci/verify-dependencies.sh gradle/libs.versions.toml

      - name: Check the Gradle configuration
        run: ./gradlew help --no-daemon --stacktrace

      # `|| true` plus a final gate: every stage runs even if an earlier one
      # fails, so one push reports compile, test, lint and packaging problems
      # together instead of one per push.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace --continue 2>&1 | tee /tmp/unit.log || true

      - name: Lint
        run: ./gradlew lintDebug --no-daemon --stacktrace --continue 2>&1 | tee /tmp/lint.log || true

      - name: Assemble the debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace --continue 2>&1 | tee /tmp/assemble.log || true

      - name: Show what was built
        run: |
          find app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -printf "%p %s bytes\n" || true

      # The Room schema is generated by KSP, so the first build of a new schema
      # version has to publish it. Committing it here keeps the exported schema
      # reviewable in git and makes later drift a real diff.
      - name: Commit the generated Room schema
        run: |
          set -uo pipefail
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/schemas
            git commit -m "chore(room): export schema v$(ls app/schemas | head -1) [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::could not push the schema"
          fi

      # The job log lives on blob storage, which a restricted network cannot
      # reach, so the summary is also published as check-run annotations that
      # the GitHub REST API can read back.
      - name: Publish the build summary as check annotations
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          {
            echo "### Stages"
            for f in /tmp/unit.log /tmp/lint.log /tmp/assemble.log; do
              [ -f "$f" ] || continue
              if grep -qE "BUILD SUCCESSFUL" "$f"; then verdict="SUCCESS"
              elif grep -qE "BUILD FAILED|FAILURE: Build failed" "$f"; then verdict="FAILED"
              else verdict="UNKNOWN"; fi
              echo "- $(basename "$f"): $verdict"
            done

            echo
            echo "### Unit test results"
            python3 - <<'PY' || echo "(no test XML found)"
          import glob, xml.etree.ElementTree as ET
          total = failures = errors = skipped = 0
          rows = []
          for path in sorted(glob.glob("app/build/test-results/**/*.xml", recursive=True)):
              root = ET.parse(path).getroot()
              total += int(root.get("tests", 0))
              failures += int(root.get("failures", 0))
              errors += int(root.get("errors", 0))
              skipped += int(root.get("skipped", 0))
              rows.append((root.get("name", path), root.get("tests", "0"),
                           root.get("failures", "0"), root.get("errors", "0")))
          for name, t, f, e in rows:
              print(f"- {name}: tests={t} failures={f} errors={e}")
          print()
          print(f"TOTAL tests={total} failures={failures} errors={errors} skipped={skipped}")
          PY

            echo
            echo "### APK"
            find app/build/outputs/apk -name "*.apk" -printf "%p %s bytes\n" 2>/dev/null || echo "(none)"

            echo
            echo "### Room schema"
            find app/schemas -type f 2>/dev/null || echo "(none)"

            echo
            echo "### Compiler and lint diagnostics"
            for f in /tmp/unit.log /tmp/lint.log /tmp/assemble.log; do
              [ -f "$f" ] || continue
              grep -E "^e: |^w: .*error|error:|What went wrong|Execution failed" "$f" | head -n 60 || true
            done
          } > /tmp/report.md

          head -c 60000 /tmp/report.md > /tmp/report-cut.md
          # `|| true` keeps the job's real verdict coming from the gate below.
          python3 - <<'PY' || echo "annotation publish failed"
          import json, os, subprocess
          body = open("/tmp/report-cut.md", encoding="utf-8").read()
          payload = {
              "status": "completed",
              "conclusion": "neutral",
              "output": {
                  "title": "Build summary",
                  "summary": body[:60000],
              },
          }
          run_id = os.environ["GITHUB_RUN_ID"]
          url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/check-runs"
          subprocess.run(
              ["gh", "api", "--method", "POST", url,
               "--field", f"name=build-summary-{run_id}",
               "--field", f"head_sha={os.environ['GITHUB_SHA']}",
               "--field", "status=completed",
               "--field", "conclusion=neutral",
               "--field", f"output[title]=Build summary {run_id}",
               "--field", f"output[summary]={body[:60000]}"],
              check=False,
          )
          PY

      - name: Fail the job if any stage failed
        run: |
          for f in /tmp/unit.log /tmp/lint.log /tmp/assemble.log; do
            [ -f "$f" ] || continue
            if grep -qE "BUILD FAILED|FAILURE: Build failed" "$f"; then
              echo "::error::$f reported a failed build"
              exit 1
            fi
          done
          if ! find app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | grep -q .; then
            echo "::error::no debug APK was produced"
            exit 1
          fi
          if find app/build/test-results -name "*.xml" 2>/dev/null | grep -q .; then
            if grep -rl "<failure\|<error" app/build/test-results 2>/dev/null | grep -q .; then
              echo "::error::at least one unit test failed"
              exit 1
            fi
          else
            echo "::error::no unit test results were produced"
            exit 1
          fi
          echo "all stages green"

      - name: Upload the debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memorymap-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memorymap-reports
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/schemas
          if-no-files-found: ignore
