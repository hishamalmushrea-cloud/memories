name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# The default workflow token in this repository is read-only, which is why the
# report could not be published before. These are the minimum scopes needed to
# commit the generated schema and to open the report issue.
permissions:
  contents: write
  issues: write
  checks: write

jobs:
  build:
    name: Assemble and test (Phase 1)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install the Android SDK packages the project needs
        run: |
          set -uo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          # Pre-accepting the licenses lets AGP auto-install anything it still
          # needs (for example a build-tools revision) without prompting.
          mkdir -p "$SDK/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK/licenses/android-sdk-preview-license"

          yes | "$MANAGER" --licenses > /dev/null || true
          "$MANAGER" --install "platform-tools" "platforms;android-36"
          # Best effort: if this exact build-tools revision is unavailable, AGP
          # downloads the one it targets by itself.
          "$MANAGER" --install "build-tools;36.0.0" || \
            echo "::warning::build-tools;36.0.0 unavailable, AGP will fetch its own"
          "$MANAGER" --list_installed || true

      # Cheap, explicit failure when a version in the catalog does not exist.
      - name: Verify every dependency coordinate resolves
        run: bash ci/verify-dependencies.sh gradle/libs.versions.toml

      - name: Check the security and privacy guarantees
        run: bash ci/check-security.sh 2>&1 | tee /tmp/security.log || true

      # Runs before Gradle on purpose: it is pure Python and answers in under a
      # second, so a mistake that would otherwise die in the compiler and waste
      # ten minutes of build reports itself immediately instead.
      - name: Check that no plain function calls a suspend DAO method
        run: python3 ci/check-suspend-calls.py

      - name: Check the Gradle configuration
        run: ./gradlew help --no-daemon --stacktrace

      # `|| true` plus a final gate: every stage runs even if an earlier one
      # fails, so one push reports compile, test, lint and packaging problems
      # together instead of one per push.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace --continue 2>&1 | tee /tmp/unit.log || true

      - name: Lint
        run: ./gradlew lintDebug --no-daemon --stacktrace --continue 2>&1 | tee /tmp/lint.log || true

      - name: Assemble the debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace --continue 2>&1 | tee /tmp/assemble.log || true

      # A release build is the only thing that runs R8, so it is the only thing
      # that can prove the shrinker rules are valid and that minification does not
      # strip something the app needs. It falls back to debug signing when no
      # keystore is supplied, which is what makes it runnable here at all.
      - name: Assemble the release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace --continue 2>&1 | tee /tmp/release.log || true

      - name: Show what was built
        run: |
          find app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -printf "%p %s bytes\n" || true

      # The Room schema is generated by KSP. This step only runs once the schema
      # is deliberately tracked in git (see .gitignore), so exporting a new
      # schema version shows up as a reviewable diff instead of a red build.
      - name: Commit the generated Room schema if it is tracked
        run: |
          set -uo pipefail
          git check-ignore -q app/schemas && { echo "app/schemas is git-ignored, nothing to do"; exit 0; }
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/schemas
            git commit -m "chore(room): export generated schema [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::could not push the schema"
          fi

      # The job log lives on blob storage, which a restricted network cannot
      # reach, so the summary is published as an issue that the GitHub REST API
      # can read back. Errors are printed instead of swallowed, and the step
      # never changes the job verdict - the gate below owns that.
      - name: Publish the build summary as an issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          {
            echo "### Stages"
            if [ -f /tmp/security.log ]; then
              if grep -q "security check: PASS" /tmp/security.log; then
                echo "- security.log: SUCCESS"
              else
                echo "- security.log: FAILED"
              fi
            fi
            for f in /tmp/unit.log /tmp/lint.log /tmp/assemble.log /tmp/release.log; do
              [ -f "$f" ] || continue
              if grep -qE "BUILD SUCCESSFUL" "$f"; then verdict="SUCCESS"
              elif grep -qE "BUILD FAILED|FAILURE: Build failed" "$f"; then verdict="FAILED"
              else verdict="UNKNOWN"; fi
              echo "- $(basename "$f"): $verdict"
            done

            echo
            echo "### Unit test results"
            python3 - <<'PY' || echo "(no test XML found)"
          import glob, xml.etree.ElementTree as ET
          total = failures = errors = skipped = 0
          detail = []
          for path in sorted(glob.glob("app/build/test-results/**/*.xml", recursive=True)):
              root = ET.parse(path).getroot()
              t = int(root.get("tests", 0)); f = int(root.get("failures", 0)); e = int(root.get("errors", 0))
              total += t; failures += f; errors += e; skipped += int(root.get("skipped", 0))
              print(f"- {root.get('name', path)}: tests={t} failures={f} errors={e}")
              for tc in root.iter("testcase"):
                  for tag in ("failure", "error"):
                      node = tc.find(tag)
                      if node is not None:
                          msg = (node.get("message") or "")[:500]
                          txt = (node.text or "").strip()[:900]
                          detail.append(f"{tc.get('classname')}.{tc.get('name')}\n  [{tag}] {msg}\n{txt}")
          print()
          print(f"TOTAL tests={total} failures={failures} errors={errors} skipped={skipped}")
          if detail:
              print()
              print("### Failing tests")
              print("\n\n".join(detail))
          PY

            echo
            echo "### Lint"
            python3 - <<'PY' || echo "(lint report step failed)"
          import glob, xml.etree.ElementTree as ET
          paths = glob.glob("app/build/reports/lint-results*.xml")
          if not paths:
              print("(no lint report found)")
          else:
              errors = 0
              warnings = 0
              shown = []
              for path in paths:
                  root = ET.parse(path).getroot()
                  for issue in root.iter("issue"):
                      sev = issue.get("severity", "")
                      if sev == "Error":
                          errors += 1
                          loc = issue.find("location")
                          where = "?"
                          if loc is not None:
                              where = loc.get("file", "?").split("/memories/")[-1] + ":" + loc.get("line", "?")
                          shown.append("- [%s] %s\n  %s\n  %s" % (issue.get("id"), issue.get("message", ""), where, (issue.get("explanation") or "")[:220]))
                      elif sev == "Warning":
                          warnings += 1
              print("errors=%d warnings=%d" % (errors, warnings))
              if shown:
                  print()
                  print("\n".join(shown[:40]))
          PY

            echo
            echo "### APK"
            find app/build/outputs/apk -name "*.apk" -printf "%p %s bytes\n" 2>/dev/null || echo "(none)"

            echo
            echo "### Room schema"
            find app/schemas -type f 2>/dev/null || echo "(none)"

            echo
            echo "### Diagnostics from the Gradle output"
            for f in /tmp/unit.log /tmp/lint.log /tmp/assemble.log; do
              [ -f "$f" ] || continue
              grep -E "^e: |error:|What went wrong|Execution failed|Caused by:|OutOfMemory|Metaspace|Killed|Daemon" "$f" | head -n 80 || true
            done

            echo
            echo "### Raw tail of the unit test log"
            echo '```'
            tail -n 150 /tmp/unit.log 2>/dev/null || true
            echo '```'

            echo "### Raw tail of the release log"
            echo '```'
            tail -n 150 /tmp/release.log 2>/dev/null || true
            echo '```'
          } > /tmp/report.md

          head -c 40000 /tmp/report.md > /tmp/report-cut.md
          echo "--- report preview (first 30 lines) ---"
          head -n 30 /tmp/report-cut.md
          echo "--- end preview ---"

          # The job log is unreadable from a restricted network, so anything
          # needed later has to be printed here or written into the issue.
          echo "--- token diagnostics ---"
          echo "actor=${GITHUB_ACTOR} trigger=${GITHUB_TRIGGERING_ACTOR} token_len=${#GH_TOKEN}"
          gh auth status 2>&1 || true

          # Two independent channels, each guarded, so a problem with one cannot
          # hide the report or change the real build verdict.
          if gh issue create \
              --title "CI report ${GITHUB_REF_NAME} run ${GITHUB_RUN_ID}" \
              --body-file /tmp/report-cut.md > /tmp/issue.out 2> /tmp/issue.err; then
            echo "issue created:"
            cat /tmp/issue.out
          else
            echo "issue create failed:"
            cat /tmp/issue.err
            cat /tmp/issue.out
          fi

          gh api --method POST "/repos/${GITHUB_REPOSITORY}/check-runs" \
            --field "name=build-report" \
            --field "head_sha=${GITHUB_SHA}" \
            --field "status=completed" \
            --field "conclusion=neutral" \
            --field "output[title]=Build report" \
            --raw-field "output[summary]=$(cat /tmp/report-cut.md)" > /dev/null 2>&1 \
            && echo "check-run annotation created" \
            || echo "check-run annotation failed"
          true

      - name: Fail the job if any stage failed
        run: |
          if [ -f /tmp/security.log ] && ! grep -q "security check: PASS" /tmp/security.log; then
            echo "::error::the security check failed"
            exit 1
          fi
          for f in /tmp/unit.log /tmp/lint.log /tmp/assemble.log /tmp/release.log; do
            [ -f "$f" ] || continue
            if grep -qE "BUILD FAILED|FAILURE: Build failed" "$f"; then
              echo "::error::$f reported a failed build"
              exit 1
            fi
          done
          if ! find app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | grep -q .; then
            echo "::error::no debug APK was produced"
            exit 1
          fi
          if ! find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | grep -q .; then
            echo "::error::no release APK was produced"
            exit 1
          fi
          if find app/build/test-results -name "*.xml" 2>/dev/null | grep -q .; then
            if grep -rl "<failure\|<error" app/build/test-results 2>/dev/null | grep -q .; then
              echo "::error::at least one unit test failed"
              exit 1
            fi
          else
            echo "::error::no unit test results were produced"
            exit 1
          fi
          echo "all stages green"

      - name: Upload the debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memorymap-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memorymap-reports
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/schemas
          if-no-files-found: ignore
